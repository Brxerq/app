<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />

    <title>Syed Muhammad Hassaan — AI Engineer & Full-Stack Developer</title>
    <meta name="description" content="Portfolio of Syed Muhammad Hassaan: AI engineer and full-stack developer building production systems, NLP copilots, and computer-vision workflows." />
    <meta name="theme-color" content="#fdfbf7" />

    <!-- Fonts first, and in parallel with the stylesheet rather than behind it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap"
    />

    <!-- Social scrapers don't resolve relative URLs, so these stay absolute. -->
    <link rel="canonical" href="https://brxerq.github.io/app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brxerq.github.io/app/" />
    <meta property="og:title" content="Syed Muhammad Hassaan — AI Engineer & Full-Stack Developer" />
    <meta property="og:description" content="AI engineer and full-stack developer building production systems, NLP copilots, and computer-vision workflows." />
    <meta property="og:image" content="https://brxerq.github.io/app/avatar.png" />
    <!-- Portrait crop, so a summary card rather than a letterboxed wide one. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Syed Muhammad Hassaan — AI Engineer & Full-Stack Developer" />
    <meta name="twitter:description" content="AI engineer and full-stack developer building production systems, NLP copilots, and computer-vision workflows." />
    <meta name="twitter:image" content="https://brxerq.github.io/app/avatar.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
